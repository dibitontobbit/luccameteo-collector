name: Temporary RainfallCorrection Inspect

on:
  push:
    paths:
      - "collector/inspect-rainfall-correction.js"
      - ".github/workflows/inspect-rainfall-correction.yml"

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - working-directory: collector
        run: npm install
      - name: Inspect RainfallCorrection
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
        run: node collector/inspect-rainfall-correction.js
