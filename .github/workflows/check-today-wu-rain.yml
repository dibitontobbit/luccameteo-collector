name: Temporary Today WU Rain Check
on:
  push:
    paths:
      - "collector/check-today-wu-rain.js"
      - ".github/workflows/check-today-wu-rain.yml"
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Check WU rain
        env:
          STATION_ID: ${{ secrets.STATION_ID }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
        run: node collector/check-today-wu-rain.js
