name: Finalize 2026 Annual Rainfall After September Backfill

on:
  workflow_run:
    workflows:
      - "Backfill September 2026 Missing Runs"
    types:
      - completed

permissions:
  contents: write

jobs:
  audit-and-finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: collector
        run: npm install --no-audit --no-fund
      - name: Audit September rainfall in Base44
        working-directory: collector
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
        run: node audit-rainfall-september-2026.js
      - name: Update authoritative 2026 annual rainfall
        working-directory: collector
        run: node finalize-annual-rainfall-2026.js
      - name: Commit updated annual rainfall summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imports/history/annual-rainfall-2026.json
          if git diff --cached --quiet; then
            echo "No rainfall summary changes to commit."
          else
            git commit -m "Finalize 2026 annual rainfall through Sep 25"
            git push
          fi
