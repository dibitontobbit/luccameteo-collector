name: Backfill 2024-2025 Weather Metrics

on:
  workflow_run:
    workflows: ["Import June-December 2025 History"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-2024-2025-metrics.yml"

jobs:
  backfill:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: collector
        run: npm install --no-audit --no-fund
      - name: Backfill wind pressure UV humidity
        working-directory: collector
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
        run: node backfill-2024-2025-metrics.js
