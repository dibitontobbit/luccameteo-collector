name: Retry September Wind Migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retry-wind-september.yml"

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: collector
        run: npm install --no-audit --no-fund
      - name: Retry failed September wind corrections
        working-directory: collector
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
        run: node retry-wind-september-failures.js
