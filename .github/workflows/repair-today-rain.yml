name: Temporary Repair Today Rain
on:
  push:
    paths:
      - "collector/repair-today-rain.js"
      - ".github/workflows/repair-today-rain.yml"
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - working-directory: collector
        run: npm install --no-audit --no-fund
      - name: Repair today rain
        env:
          STATION_ID: ${{ secrets.STATION_ID }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
        run: node collector/repair-today-rain.js
