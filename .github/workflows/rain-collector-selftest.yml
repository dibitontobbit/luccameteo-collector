name: Temporary Rain Collector Selftest

on:
  push:
    paths:
      - ".github/workflows/rain-collector-selftest.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - working-directory: collector
        run: npm install --no-audit --no-fund
      - name: Run collector rainfall selftest
        working-directory: collector
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
          STATION_ID: ${{ secrets.STATION_ID }}
        run: node collect.js
