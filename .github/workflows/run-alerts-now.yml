name: CFR Alerts One-Off

on:
  push:
    branches: [main]

jobs:
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: collector
        run: npm install --no-audit --no-fund
      - name: Run CFR alerts collector
        working-directory: collector
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
          ALERT_ZONES: S2
        run: node alerts.js
