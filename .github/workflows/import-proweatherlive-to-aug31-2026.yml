name: Import ProWeatherLive through Aug 31 2026

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-proweatherlive-to-aug31-2026.yml"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: collector
        run: npm install --no-audit --no-fund
      - name: Import real ProWeatherLive 5 Feb - 31 Aug 2026
        working-directory: collector
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
        run: node import-proweatherlive-to-aug31-2026.js
