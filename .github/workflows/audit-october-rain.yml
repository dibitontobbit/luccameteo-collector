name: Temporary October Rain Audit

on:
  push:
    paths:
      - "collector/audit-october-rain.js"
      - ".github/workflows/audit-october-rain.yml"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - working-directory: collector
        run: npm install
      - name: Audit October rainfall
        env:
          STATION_ID: ${{ secrets.STATION_ID }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
        run: node collector/audit-october-rain.js
