name: Weather Collector

concurrency:
  group: luccameteo-weather-collector
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  collect:
    timeout-minutes: 15
    # Pin the production runner so the future ubuntu-latest migration
    # cannot change the OS underneath the collector without us deciding.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: collector
        run: npm install --no-audit --no-fund

      - name: Run collector
        working-directory: collector
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          COLLECTOR_EMAIL: ${{ secrets.COLLECTOR_EMAIL }}
          COLLECTOR_PASSWORD: ${{ secrets.COLLECTOR_PASSWORD }}
          STATION_ID: ${{ secrets.STATION_ID }}
        run: node collect.js
